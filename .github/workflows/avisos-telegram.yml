name: Avisos no Telegram

on:
  schedule:
    # 12:00 UTC = 09:00 em Brasília. O GitHub pode atrasar alguns minutos
    # em horários cheios; pra agenda de corrida isso não faz diferença.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'O que fazer'
        type: choice
        default: teste
        options:
          # manda UMA mensagem no grupo só pra provar que token e chat_id
          # estão certos. É o único modo que conversa com o Telegram sem
          # depender de ter corrida nova na planilha.
          - teste
          # mostra no log o que seria postado, sem postar nada
          - dry-run
          # comportamento normal, igual ao do agendamento diário
          - valendo

permissions:
  contents: write

# Se duas execuções se cruzarem, a segunda espera — senão as duas mexem no
# estado.json ao mesmo tempo e uma sobrescreve a outra.
concurrency:
  group: avisos-telegram
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enviar avisos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGINA_URL: https://rafael-peters.github.io/Bora-correr/
        # Sem "modo" (execução agendada), o case cai no *) e roda valendo.
        run: |
          case "${{ inputs.modo }}" in
            teste)   node bot/avisos.mjs --teste   ;;
            dry-run) node bot/avisos.mjs --dry-run ;;
            *)       node bot/avisos.mjs           ;;
          esac

      - name: Registrar o que já foi avisado
        if: ${{ inputs.modo != 'teste' && inputs.modo != 'dry-run' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/estado.json
          git diff --staged --quiet || (git commit -m "Registra avisos enviados [skip ci]" && git push)
